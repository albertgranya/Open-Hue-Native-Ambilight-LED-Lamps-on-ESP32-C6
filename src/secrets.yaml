# secretsfixme.yaml - template of the secrets used by the three firmwares of this repository:
#   cactus_ambilight.yaml, LolaLampGradientHue.yaml and snifferzigbeewifi.yaml
#
# Copy this file to secrets.yaml (same folder as the YAMLs) and replace every FIXME value.
# Never commit secrets.yaml.

# --- Wi-Fi (all three firmwares) ---
# Main network. Used by the Wi-Fi window at boot (OTA updates and Home Assistant).
wifi_ssid: "FIXME"
# Password of the Wi-Fi networks. LolaLampGradientHue.yaml and snifferzigbeewifi.yaml use it for both SSIDs.
wifi_password: "FIXME"
# Second, lower-priority network (LolaLampGradientHue.yaml and snifferzigbeewifi.yaml).
# If you only have one network, repeat wifi_ssid here.
wifi_ssid_b: "FIXME"

# --- ESPHome native API (cactus_ambilight.yaml) ---
# Encryption key for the Home Assistant API: 32 random bytes in base64 (44 characters).
# Generate one with:  openssl rand -base64 32
api_key_cactushue: "FIXME"

# --- MQTT (snifferzigbeewifi.yaml) ---
# Local MQTT broker (IP address or hostname) used to send commands to the sniffer during the Wi-Fi window,
# for example the Zigbee channel or the network key.
# NOTE: It is strongly recommended to use your own private broker on your local network, with a username and a
# password. Do not use a public broker (test.mosquitto.org, broker.hivemq.com, ...): anyone could read what the
# sniffer publishes and write to its cmd topics, including cmd/nwk_key, which carries the Zigbee network key in
# plain text.
mqttbrokerlocal: "FIXME"
mqttusername: "FIXME"
mqttpassword: "FIXME"

# --- Not a secret entry: Zigbee network key of the sniffer ---
# snifferzigbeewifi.yaml does not read the network key from this file. Pass it when compiling,
#   esphome -s nwk_key <32 hex characters> run snifferzigbeewifi.yaml
# or send it at runtime through the API action set_nwk_key or the MQTT topic .../cmd/nwk_key.
# Never commit the network key: with it anyone nearby can read and control your Zigbee network.
